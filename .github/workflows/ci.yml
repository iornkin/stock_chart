name: CI
on:
  push:
    branches-ignore: [data]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # 정적 사이트(GitHub Pages) 빌드가 깨지지 않았는지 확인 (빈 DB 로 빌드)
      - run: npm run build:static
